<!doctype html>
<html lang="ja">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./css/app.css">

  <title>Admin</title>
</head>
<body>
  <div class="container">
    <h1>Admin</h1>

    <div class="border p-2">
      <h2>Game</h2>
      <div class="row">
        <div class="col-3">Game</div>
        <div class="col-9">Players</div>
      </div>
      <div id="game" class="row mb-3"></div>
      <div class="row mb-3">
        <div class="col-4">
          <button id="newGame" class="btn btn-primary" type="button">New game</button>
        </div>
        <div class="col-8">
          <label for="players" class="form-label">Players</label>
            <div id="players" class="input-group mb-3">
              <input name="players[]" class="form-control" type="text" placeholder="PC" value="DEIRmen">
              <select name="tarots[]" class="form-select">
                <option selected>Select tarot</option>
              </select>
			  <button class="btn btn-success add" type="button" aria-label="add"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5a.5.5 0 0 1 .5.5v3.5H12a.5.5 0 0 1 0 1H8.5V12a.5.5 0 0 1-1 0V8.5H4a.5.5 0 0 1 0-1h3.5V4a.5.5 0 0 1 .5-.5z"/></svg></button>
            </div>
            <div class="input-group mb-3">
              <input name="players[]" class="form-control" placeholder="PC" value="Litzia">
              <select name="tarots[]" class="form-select">
                <option selected>Select tarot</option>
              </select>
			  <button class="btn btn-danger remove" type="button" aria-label="remove"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5z"/></svg></button>
            </div>
            <div class="input-group mb-3">
              <input name="players[]" class="form-control" placeholder="PC" value="yuzuki">
              <select name="tarots[]" class="form-select">
                <option selected>Select tarot</option>
              </select>
			  <button class="btn btn-danger remove" type="button" aria-label="remove"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5z"/></svg></button>
            </div>
          <div class="copy d-none">
            <div class="input-group mb-3">
              <input name="players[]" class="form-control" placeholder="PC">
              <select name="tarots[]" class="form-select">
                <option selected>Select tarot</option>
              </select>
			  <button class="btn btn-danger remove" type="button" aria-label="remove"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5z"/></svg></button>
            </div>
          </div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col">
          <div class="input-group">
            <button id="deleteGame" class="btn btn-primary" type="button">Delete game</button>
            <select id="deleteGameSelect" class="form-select">
              <option selected>Select game</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="border p-2">
      <h2>Status</h2>
      <details class="mb-3">
        <summary class="btn btn-primary">collapse</summary>
        <div id="status"></div>
      </details>
    </div>

  </div>

  <script src="./js/admin.js" type="module"></script>
</body>
</html>
