<!doctype html>
<html lang="ja">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./css/app.css">

  <title>管理</title>
</head>
<body>
  <div class="container">
    <div class="head">
      <h1>管理</h1>
      <span class="sub">DECKS</span>
    </div>

    <section class="panel">
      <h2>卓</h2>
      <div class="row">
        <div class="col-1">卓</div>
        <div class="col-3">プレーヤー</div>
        <div class="col-8">参加者へ配る URL</div>
      </div>
      <div id="game" class="row mb-3"></div>
      <div class="row mb-3">
        <div class="col-4">
          <button id="newGame" class="btn btn-primary" type="button">卓を作る</button>
        </div>
        <div class="col-8">
          <label for="players" class="form-label">プレーヤー</label>
            <div id="players" class="input-group mb-3">
              <input name="players[]" class="form-control" type="text" placeholder="名前" value="DEIRmen">
              <select name="tarots[]" class="form-select">
                <option selected>タロットを選ぶ</option>
              </select>
			  <button class="btn btn-success add" type="button" aria-label="add"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5a.5.5 0 0 1 .5.5v3.5H12a.5.5 0 0 1 0 1H8.5V12a.5.5 0 0 1-1 0V8.5H4a.5.5 0 0 1 0-1h3.5V4a.5.5 0 0 1 .5-.5z"/></svg></button>
            </div>
            <div class="input-group mb-3">
              <input name="players[]" class="form-control" placeholder="名前" value="Litzia">
              <select name="tarots[]" class="form-select">
                <option selected>タロットを選ぶ</option>
              </select>
			  <button class="btn btn-danger remove" type="button" aria-label="remove"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5z"/></svg></button>
            </div>
            <div class="input-group mb-3">
              <input name="players[]" class="form-control" placeholder="名前" value="yuzuki">
              <select name="tarots[]" class="form-select">
                <option selected>タロットを選ぶ</option>
              </select>
			  <button class="btn btn-danger remove" type="button" aria-label="remove"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5z"/></svg></button>
            </div>
          <div class="copy d-none">
            <div class="input-group mb-3">
              <input name="players[]" class="form-control" placeholder="名前">
              <select name="tarots[]" class="form-select">
                <option selected>タロットを選ぶ</option>
              </select>
			  <button class="btn btn-danger remove" type="button" aria-label="remove"><svg class="bi" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5z"/></svg></button>
            </div>
          </div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col">
          <div class="input-group">
            <button id="deleteGame" class="btn btn-primary" type="button">卓を消す</button>
            <select id="deleteGameSelect" class="form-select">
              <option selected>卓を選ぶ</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>状態</h2>
      <details>
        <summary class="btn btn-secondary">表示</summary>
        <div id="status" class="status"></div>
      </details>
    </section>

  </div>

  <script src="./js/admin.js" type="module"></script>
</body>
</html>
